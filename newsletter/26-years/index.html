<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>26 Years · Elemental Studios</title>
<meta name="description" content="A 26-year message from Bruce Quiroz, Elemental Studios.">
<meta name="robots" content="noindex">
<meta property="og:title" content="26 Years · The Human Element">
<meta property="og:description" content="A message from the studio floor.">
<meta property="og:image" content="https://elemental-studios-us.github.io/email-assets/newsletter/26-years/cover4.jpg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050505;--ink:#f3ede6;--mute:#8d817a;--fire:#e0563a;--glow:#ff6a45}
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--bg);color:var(--ink);min-height:100%}
  body{font-family:'Space Grotesk',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;
       background:radial-gradient(60% 45% at 50% 40%,rgba(224,86,58,.18),transparent 70%),var(--bg)}
  .logo{width:150px;height:auto;opacity:.95}
  .eyebrow{font-family:'JetBrains Mono',Consolas,monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--fire);margin-top:22px}
  h1{font-size:clamp(26px,6vw,38px);line-height:1.05;text-align:center;margin-top:8px}
  h1 span{color:var(--fire)}
  .stage{position:relative;width:min(420px,100%);aspect-ratio:456/640;margin-top:22px;border-radius:22px;overflow:hidden;background:#000;
         box-shadow:0 0 0 1px rgba(255,106,69,.45),0 0 50px rgba(224,86,58,.3),0 30px 60px rgba(0,0,0,.7)}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block}






  .quote{margin-top:26px;font-size:clamp(18px,4.6vw,24px);text-align:center;max-width:460px}
  .quote span{color:var(--fire)}
  .cta{margin-top:22px;display:inline-block;padding:14px 24px;border:1px solid rgba(255,106,69,.6);border-radius:999px;color:var(--ink);text-decoration:none;
       font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase}
  .cta:hover{background:rgba(224,86,58,.15)}
  footer{margin-top:28px;font-family:'JetBrains Mono',Consolas,monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);text-align:center}
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Elemental Studios">
  <div class="eyebrow">26-year message &nbsp;/&nbsp; From the studio floor</div>
  <h1>26 Years. <span>The Human Element.</span></h1>

  <div class="stage">
    <video src="message2.mp4" poster="cover4.jpg" controls playsinline webkit-playsinline preload="metadata"
           aria-label="Bruce Quiroz: 26-year message from Elemental Studios">
      <a href="message2.mp4">Watch the 26-year message</a>
    </video>
  </div>

  <p class="quote">"A camera, a computer <span>and a dream."</span></p>
  <a class="cta" href="https://www.elementalstudios.us/">Visit Elemental Studios &rarr;</a>
  <footer>Elemental Studios &middot; 1662 Savannah Hwy, Ste 320 &middot; Charleston, SC</footer>
</body>
</html>
